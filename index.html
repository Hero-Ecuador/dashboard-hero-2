<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En proceso...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f8fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: clamp(42px, 8vw, 90px);
      font-weight: 800;
      letter-spacing: 3px;
      color: #1f2937;
    }

    .dots {
      display: inline-flex;
      gap: 8px;
      margin-top: 18px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1f2937;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: 0.25;
        transform: scale(0.8);
      }
      30% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>EN PROCESO</h1>
    <div class="dots" aria-label="Cargando">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </main>
</body>
</html>
